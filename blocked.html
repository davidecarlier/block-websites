<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title data-i18n="blockedTitle">Sito bloccato</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #1c1e21; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center;
    }
    .box { max-width: 460px; padding: 32px; }
    .icon { font-size: 64px; margin-bottom: 12px; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { color: #b0b3b8; line-height: 1.5; margin: 0 0 8px; }
    strong { color: #fff; }
    #until { margin-top: 16px; font-size: 13px; }
    .resume {
      margin-top: 24px; padding: 14px 16px; background: #2b2e33; border-radius: 10px; text-align: left;
    }
    .resume .label { font-size: 12px; color: #8a8d91; margin-bottom: 4px; }
    .resume a { color: #7cc4ff; word-break: break-all; text-decoration: none; font-size: 14px; }
    .resume a:hover { text-decoration: underline; }
    .resume .note { font-size: 12px; color: #8a8d91; margin-top: 8px; }
    .resume.ready { background: #1f3d2b; }
    .resume.ready .note { color: #6fd39a; font-weight: 600; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">⏳</div>
    <h1 data-i18n="blockedTitle"></h1>
    <p><strong id="site"></strong> <span data-i18n="notAvailable"></span></p>
    <p id="until"></p>
    <div class="resume" id="resume" hidden>
      <div class="label" data-i18n="resumeLabel"></div>
      <a id="link" href="#"></a>
      <div class="note" id="note" data-i18n="resumeNote"></div>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="schedule.js"></script>
  <script src="blocked.js"></script>
</body>
</html>
