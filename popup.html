<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
  <style>
    body { width: 300px; padding: 14px; background: #fff; }
    h1 { font-size: 15px; margin: 0; }
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    ul { list-style: none; padding: 0; margin: 0 0 12px; }
    li { padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
    li:last-child { border-bottom: none; }
    .empty { color: var(--muted); margin: 0 0 12px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-right: 6px; }

    /* Interruttore */
    .toggle { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider {
      position: absolute; inset: 0; background: #ccc; border-radius: 24px; cursor: pointer; transition: .2s;
    }
    .toggle .slider::before {
      content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 2px rgba(0,0,0,.3);
    }
    .toggle input:checked + .slider { background: var(--accent); }
    .toggle input:checked + .slider::before { transform: translateX(20px); }
    .state { font-size: 12px; color: var(--muted); margin: -6px 0 12px; }
    .state.on { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <div class="top">
    <h1>Blocco Siti a Orari</h1>
    <label class="toggle" title="Attiva o disattiva il blocco">
      <input type="checkbox" id="master">
      <span class="slider"></span>
    </label>
  </div>
  <div class="state" id="state"></div>
  <div id="content"></div>
  <button id="options" class="primary" style="width:100%">Gestisci regole</button>
  <script src="schedule.js"></script>
  <script src="popup.js"></script>
</body>
</html>
